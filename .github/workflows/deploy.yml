name: Deploy Lottery App to GitHub Pages

on:
  push:
    branches: [ master, mentat-0-1 ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: mobile-app/package-lock.json
        
    - name: Install dependencies
      run: |
        cd mobile-app
        npm ci
        
    - name: Install web dependencies
      run: |
        cd mobile-app
        npx expo install react-native-web@~0.18.10 react-dom@18.2.0 @expo/webpack-config@^18.0.1
        
    - name: Create assets if missing
      run: |
        cd mobile-app
        mkdir -p assets
        if [ ! -f assets/favicon.png ]; then
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==" | base64 -d > assets/favicon.png
          cp assets/favicon.png assets/icon.png
          cp assets/favicon.png assets/splash.png
          cp assets/favicon.png assets/adaptive-icon.png
        fi
        
    - name: Build for web
      run: |
        cd mobile-app
        npx expo export:web
        
    - name: Setup Pages
      uses: actions/configure-pages@v5
      continue-on-error: true
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: mobile-app/web-build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
